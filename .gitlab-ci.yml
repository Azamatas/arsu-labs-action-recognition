stages:
  - lint
  - format

# Check pep8 compliance

pep8-lint:
  stage: lint
  image: python:3.12
  before_script:
    - pip install ruff
    - chmod +x actions/run_ruff.sh
  script:
    - ./actions/run_ruff.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# Auto-fix
pep8-format:
  stage: format
  image: python:3.12
  before_script:
    - pip install ruff
  script:
    - echo "Running Ruff formatter..."
    - ruff format .
    - ruff check --fix .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  allow_failure: true